# A controller on a laptop: closing the lid must not suspend it - asleep it
# drops a transmission mid-over and stops receiving. Installed as
# /etc/systemd/logind.conf.d/50-openhamshack.conf.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
# The hibernate key on some keyboards would stop the controller mid-over
# with nothing to wake it (first real PC, 09/10/2026). The power button keeps
# logind's default, a clean power-off: on a box with no screen UI it is how
# a person turns it off on purpose.
HandleHibernateKey=ignore
HandlePowerKey=poweroff
